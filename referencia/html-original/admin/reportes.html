<!doctype html>
<html lang="es" data-base="..">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C2A55">
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Reportes · Tabi Admin</title>
</head>
<body class="admin">
  <nav class="nav" id="nav" data-activo="reportes"></nav>
  <main class="panel">
    <div class="panel__cabecera"><h1 class="panel__saludo">Reportes</h1></div>

    <section class="tarjeta bloque">
      <div class="filtros">
        <label class="campo"><span>Desde</span><input type="date" id="desde"></label>
        <label class="campo"><span>Hasta</span><input type="date" id="hasta"></label>
        <label class="campo"><span>Canal</span>
          <select id="canal"><option value="">Todos</option><option value="mesa">Mesa</option><option value="whatsapp">WhatsApp</option></select>
        </label>
        <label class="campo"><span>Estado</span>
          <select id="estado"><option value="">Todos</option><option value="recibido">Recibido</option><option value="preparando">Preparando</option><option value="entregado">Entregado</option></select>
        </label>
        <button class="boton boton--contorno" id="exportar">Descargar CSV</button>
      </div>
      <div class="rejilla rejilla--3" id="resumen-reportes"></div>
    </section>

    <section class="tarjeta bloque">
      <div class="bloque__titulo"><h3>Pedidos</h3><span class="texto-pequeno texto-suave" id="conteo-pedidos"></span></div>
      <div class="tabla-envoltura">
        <table class="tabla">
          <thead><tr><th>Pedido</th><th>Fecha</th><th>Mesa</th><th>Canal</th><th>Platos</th><th>Total</th><th>Estado</th></tr></thead>
          <tbody id="tabla-pedidos"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="../js/admin/reportes.js"></script>
</body>
</html>
